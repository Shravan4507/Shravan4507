<svg width="644" height="324" viewBox="78 38 644 324" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes blink {
      50% { opacity: 0 }
    }

    .terminal-window {
      fill: rgba(0, 5, 0, 0.95);
      stroke: #00ff41;
      stroke-width: 1.5;
    }

    .text {
      fill: #00ff41;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      filter: drop-shadow(0 0 4px rgba(0, 255, 65, 0.6));
    }
    
    .cursor {
      fill: #00ff41;
      animation: blink 1s step-end infinite;
    }
  </style>

  <!-- Terminal UI -->
  <rect x="80" y="40" width="640" height="320" rx="16" class="terminal-window" />
  
  <!-- Header Bar -->
  <rect x="80" y="40" width="640" height="30" rx="16" fill="#00ff41" fill-opacity="0.15" />
  <circle cx="105" cy="55" r="5" fill="#ff5f56" />
  <circle cx="125" cy="55" r="5" fill="#ffbd2e" />
  <circle cx="145" cy="55" r="5" fill="#27c93f" />
  
  <!-- The Content -->
  <g transform="translate(100, 100)">
    <text y="0" class="text">shrvan:~$ where shrvan</text>
    <text y="25" class="text">bash: shrvan: not found</text>
    
    <text y="60" class="text">shrvan:~$ find shrvan</text>
    <text y="85" class="text">find: ‘shrvan’: Not found</text>
    
    <text y="120" class="text">shrvan:~$ why</text>
    <text y="145" class="text">reason: 'shrvan' is probably de*d</text>
    
    <text y="180" class="text">shrvan:~$ status</text>
    <text y="205" class="text">status: Everything is RELATIVE...</text>
    
    <rect x="305" y="190" width="10" height="18" class="cursor" />
  </g>

  <!-- Scanline Overlay Effect -->
  <pattern id="scanlines" width="800" height="4" patternUnits="userSpaceOnUse">
    <rect width="800" height="2" fill="rgba(0, 255, 65, 0.05)" />
  </pattern>
  <rect x="80" y="40" width="640" height="320" rx="16" fill="url(#scanlines)" style="pointer-events: none;" />
</svg>
